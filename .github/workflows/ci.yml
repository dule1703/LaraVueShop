name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Kopiraj .env
        run: cp .env.example .env

      - name: Install PHP dependencies (sa dev zavisnostima, za PHPUnit)
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install & build frontend (za Vite manifest, testovi renderuju Inertia view-ove)
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Pokreni JS testove (vitest)
        run: npm run test

      - name: Generisi app key
        run: php artisan key:generate

      - name: Pokreni testove
        run: composer test
