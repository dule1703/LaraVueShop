name: Build & Deploy

on:
  push:
    branches: [main, develop]

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Kopiraj .env
        run: cp .env.example .env

      - name: Install PHP dependencies (sa dev zavisnostima, za PHPUnit)
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install & build frontend (za Vite manifest, testovi renderuju Inertia view-ove)
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Generisi app key
        run: php artisan key:generate

      - name: Pokreni testove
        run: composer test

  build-and-deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Odredi okruzenje i timestamp
        id: vars
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_name=production" >> "$GITHUB_OUTPUT"
          else
            echo "env_name=staging" >> "$GITHUB_OUTPUT"
          fi
          echo "ts=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PHP dependencies (for Ziggy)
        run: composer install --no-dev --optimize-autoloader

      - name: Install & build frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Dodaj server u known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Napravi release direktorijum i prenesi build (tar + ssh, bez oslanjanja na remote rsync)
        run: |
          tar czf - \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude="vendor" \
            --exclude="tests" \
            --exclude="storage" \
            --exclude=".env" \
            --exclude="deploy" \
            . | ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p ~/projects/laravue-shop/deploy/${{ steps.vars.outputs.env_name }}/releases/${{ steps.vars.outputs.ts }} && tar xzf - -C ~/projects/laravue-shop/deploy/${{ steps.vars.outputs.env_name }}/releases/${{ steps.vars.outputs.ts }}"

      - name: Osvezi finish-release.sh na trajnoj putanji na serveru
        run: |
          scp -P ${{ secrets.SSH_PORT }} deploy/finish-release.sh \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/projects/laravue-shop/deploy/${{ steps.vars.outputs.env_name }}/finish-release.sh

      - name: Zavrsi release na serveru (composer, migracije, cache, symlink swap, cleanup)
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "bash ~/projects/laravue-shop/deploy/${{ steps.vars.outputs.env_name }}/finish-release.sh ${{ steps.vars.outputs.env_name }} ${{ steps.vars.outputs.ts }}"

  notify:
    needs: [tests, build-and-deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Odredi environment i status
        id: status
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env_name=production" >> "$GITHUB_OUTPUT"
          else
            echo "env_name=staging" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ needs.tests.result }}" = "success" ] && [ "${{ needs.build-and-deploy.result }}" = "success" ]; then
            echo "status=USPESNO" >> "$GITHUB_OUTPUT"
          else
            echo "status=NEUSPESNO" >> "$GITHUB_OUTPUT"
          fi

      - name: Posalji email obavestenje
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.NOTIFY_SMTP_HOST }}
          server_port: ${{ secrets.NOTIFY_SMTP_PORT }}
          secure: true
          username: ${{ secrets.NOTIFY_SMTP_USER }}
          password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}
          from: LaraVueShop CI
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          subject: "[LaraVueShop] Deploy ${{ steps.status.outputs.env_name }} - ${{ steps.status.outputs.status }}"
          body: |
            Environment: ${{ steps.status.outputs.env_name }}
            Grana: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}
            Poruka commit-a: ${{ github.event.head_commit.message }}

            Tests job: ${{ needs.tests.result }}
            Build & deploy job: ${{ needs.build-and-deploy.result }}

            Detalji i logovi: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
